# One on-demand EC2 c8gd.metal-24xl per run, launched fresh and terminated when
# the run ends. Graviton4 has no SMT and there is no hypervisor: the 96 vCPUs
# are 96 physical cores, and a cgroup CPU cap means what it says.
#
# `env_digest` on every record is a hash of this file.

id = "c8gd-metal-24xl-ec2-docker"

# The site removes its "not authoritative" banner from this field.
class = "authoritative"

[host]
description = "AWS EC2 c8gd.metal-24xl, 3 x 1,900 GB local NVMe SSD, EBS gp3 200 GiB root"
cpu         = "AWS Graviton4"
cores       = 96
core_layout = "homogeneous: 96 physical cores, no SMT"
memory      = "192 GiB"
os          = "Ubuntu 24.04, Docker CE"
arch        = "aarch64"

caveats = """
Storage is the instance's own NVMe. ClickHouse, the broker and Docker's data
root each get a device, so the write path and the read path under test do not
share a queue. Nothing about the disk is provisioned, so nothing about it is a
variable this profile has to declare.

The host is bare metal: the Nitro hypervisor is absent, not merely
well-behaved.
"""

# The measured split, from the 2026-08-25 tuning ladder on this host.
#
# The consume ceiling is flat across 8..32 partitions (1.09-1.11M msgs/s,
# broker under 2 of 8 offered cores at every rung), so the widest topic is
# free and it is what lets a 32-thread consumer spend its parallelism.
# The broker cap measures within 1% of an 8-core one.
#
# ClickHouse, from the 2026-11-01 tuning runs on 26.8.36.3 with spate 0.4.0:
# the native arm at about 35M rows/s holds a 32-core server at about 31 cores,
# throttled 3.8-4.6 s per second, and a 48-core server unthrottled at about 32
# cores. The arm's rate is the same at 32 and 48, and the merge pool (16
# threads, the shipped default) runs full under both.
#
# ClickHouse memory is sized for the ingest ceiling pass, which posts
# 1,029,000-row blocks and needs every format to reach the cpu cap on a rung it
# can drive. Each format gets there by 64 concurrent inserts. One such insert
# peaks at 165 MiB (Native), 168 MiB (RowBinary), 312 MiB (ArrowStream) and
# 364 MiB (JSONEachRow) on 26.8.36.3. At 32g, 64 ArrowStream inserts reached
# the server's limit (0.9 of the cap, 28.8 GiB resident against 17.8 GiB
# tracked) and were refused. 64g sets the limit at 57.6 GiB.
#
# CPU: 3 broker + 48 clickhouse + 32 arm envelope = 83 of 96, leaving 13
# for the driver, the sampler and the host. Memory: 8g + 64g + 96g + 2g of
# Flink control plane = 170 GiB of 188 in caps, leaving 18 for the page cache
# and the driver. The arms and the ceiling pass do not run at once. The largest
# measured arm peak is 56 GiB (vector) against the 96 GiB envelope.
#
# Changing these caps, the partition count or the storage kind moves
# `infra_digest`, and `Ceilings::gate` drops every ceiling not measured under
# the new one.
[infra]
partitions = 32

[infra.broker]
kind     = "redpanda"
image    = "redpandadata/redpanda:v26.1.13"
cpus     = "3"
memory   = "8g"
registry = "redpanda-builtin"
# Consume read concurrency per shard. The default of 1 reads one partition at a
# time, which caps a fetch at the sum of its partition reads. 4 measured about
# 13% above the default on the native arm, and 8 and 16 added nothing past it.
cluster  = { fetch_max_read_concurrency = "4" }

# Stock server defaults. On 26.8 these include `materialize_statistics_on_insert`
# with `auto_statistics_types = 'basic, uniq_v2'`, so every insert into the
# target table builds column statistics: about 13-23% more server CPU per row
# than 26.3 in a side-by-side Docker measurement. Every arm pays it, and the
# ceilings are measured with it.
[infra.clickhouse]
image  = "clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7"
cpus   = "48"
memory = "64g"

# `kind` is in `infra_digest`; the paths are not. A path that is not its own
# mount fails the run before any container starts.
[infra.storage]
kind            = "local-nvme"
clickhouse_data = "/mnt/bench-clickhouse"
broker_data     = "/mnt/bench-broker"

# Written by `bench ceiling --measure --write --env c8gd-metal-24xl-ec2-docker`
# on the box. An arm above 70% of the consume ceiling is infra-bound. ClickHouse
# is held to its measured saturation over each arm's window, and its ingest
# ceiling decides only when those counters are missing (methodology/envelope.md).
[ceiling]
file = "ceilings/c8gd-metal-24xl-ec2-docker.json"

# Measured 2026-08-25 by a five-pair A/A calibration (the first arm against
# itself, 40M batches): median pair spread 0.25% on rows_per_s_per_core, worst
# single pair 0.92%. The declared threshold carries margin over the
# observation: a sweep whose control pair disagrees by more than this has a
# rig problem, and its timing verdicts are not evidence.
[noise]
aa_spread = 0.02
