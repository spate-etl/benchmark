# One on-demand EC2 c8gd.metal-24xl per run, launched fresh and terminated when
# the run ends. Graviton4 has no SMT and there is no hypervisor: the 96 vCPUs
# are 96 physical cores, and a cgroup CPU cap means what it says.
#
# `env_digest` on every record is a hash of this file.

id = "c8gd-metal-24xl-ec2-docker"

# The site removes its "not authoritative" banner from this field.
class = "authoritative"

[host]
description = "AWS EC2 c8gd.metal-24xl, 3 x 1,900 GB local NVMe SSD, EBS gp3 200 GiB root"
cpu         = "AWS Graviton4"
cores       = 96
core_layout = "homogeneous: 96 physical cores, no SMT"
memory      = "192 GiB"
os          = "Ubuntu 24.04, Docker CE"
arch        = "aarch64"

caveats = """
Storage is the instance's own NVMe. ClickHouse, the broker and Docker's data
root each get a device, so the write path and the read path under test do not
share a queue. Nothing about the disk is provisioned, so nothing about it is a
variable this profile has to declare.

The host is bare metal: the Nitro hypervisor is absent, not merely
well-behaved.
"""

# The measured split, from the 2026-08-25 tuning ladder on this host.
#
# The consume ceiling is flat across 8..32 partitions (1.09-1.11M msgs/s,
# broker under 2 of 8 offered cores at every rung), so the widest topic is
# free and it is what lets a 32-thread consumer spend its parallelism.
# The broker cap measures within 1% of an 8-core one. ClickHouse ingest
# plateaus at ~28 cores whatever the cap: RowBinary reaches 6.0M rows/s at
# 16 cpus throttling, 11.0M at 32, and the same 11.0M at 48 and 64 with
# cores idle — 32 is the smallest cap at that plateau, and every core past
# it buys background merges rather than ceiling.
#
# CPU: 3 broker + 32 clickhouse + 32 arm envelope = 67 of 96, leaving 29
# for the driver, the sampler and the host. Memory: 8g + 32g + 96g + 2g of
# Flink control plane = 138 GiB of 188, leaving 50 for the page cache and
# the driver. The largest measured arm peak is 56 GiB (vector) against the
# 96 GiB envelope.
#
# Changing these caps, the partition count or the storage kind moves
# `infra_digest`, and `Ceilings::gate` drops every ceiling not measured under
# the new one.
[infra]
partitions = 32

[infra.broker]
kind     = "redpanda"
image    = "redpandadata/redpanda:v26.1.13"
cpus     = "3"
memory   = "8g"
registry = "redpanda-builtin"

[infra.clickhouse]
image  = "clickhouse/clickhouse-server:26.3"
cpus   = "32"
memory = "32g"

# `kind` is in `infra_digest`; the paths are not. A path that is not its own
# mount fails the run before any container starts.
[infra.storage]
kind            = "local-nvme"
clickhouse_data = "/mnt/bench-clickhouse"
broker_data     = "/mnt/bench-broker"

# Written by `bench ceiling --measure --write --env c8gd-metal-24xl-ec2-docker`
# on the box. An arm above 70% of the measured ceiling is infra-bound and cannot
# be published.
[ceiling]
file = "ceilings/c8gd-metal-24xl-ec2-docker.json"
