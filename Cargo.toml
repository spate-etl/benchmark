[workspace]
resolver = "3"
members = [
    "harness",
    # The Flink entrant is a Maven project, not a workspace member. Rust entrants
    # are members so one `cargo build --locked` covers them and one lockfile
    # pins their transitive graph.
    "entrants/spate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Marcus Kainth <marcus@kainth.dev>"]
repository = "https://github.com/spate-etl/benchmark"

[workspace.dependencies]
spate-benchmark-harness = { version = "=0.1.0", path = "harness" }

# The framework under test.
#
# A version from crates.io now that 0.1.0 is published. Before that it was a git
# dependency pinned to a rev, because a path dep records nothing about what was
# measured and breaks on any clone. The reason is unchanged either way: what
# identifies the code under test has to land in Cargo.lock and travel into every
# record. A benchmark whose result cannot say which code produced it is not
# evidence.
#
# Records produced from here on carry `sut.version`. The ones already in
# `results/` carry `sut.commit`, because they were measured before 0.1.0 existed
# — the schema accepts either, and saying they were 0.1.0 would be false.
# CANDIDATE BRANCH — pinned to an unreleased revision, never to be merged.
#
# spate-etl/spate `perf/held-datum-reader` at 930a467692ec212ad8fcc546e49b5fc325b6924f, the evidence branch for
# spate-etl/spate#250: `DecoderCore` holds a `GenericDatumReader` per writer
# schema id instead of resolving the schema's named types on every payload. A
# git source makes `entrants/spate/build.rs` report `0.1.0-dev` and bake this
# commit, so a record measured here says what it was built from instead of
# claiming a release.
#
# `results/` on main must never carry these numbers: they describe code nobody
# has shipped. The collector bases a candidate run's PR on this branch, so
# reaching main would take a second, deliberate merge of the pin itself.
spate-core = { git = "https://github.com/spate-etl/spate", rev = "930a467692ec212ad8fcc546e49b5fc325b6924f" }
spate-avro = { git = "https://github.com/spate-etl/spate", rev = "930a467692ec212ad8fcc546e49b5fc325b6924f" }
spate-kafka = { git = "https://github.com/spate-etl/spate", rev = "930a467692ec212ad8fcc546e49b5fc325b6924f" }
spate-clickhouse = { git = "https://github.com/spate-etl/spate", rev = "930a467692ec212ad8fcc546e49b5fc325b6924f" }

# Tracks the pinned spate, which moved to 0.22. The arm decodes into
# `apache_avro::types::Value`, so two versions here would be two distinct types.
apache-avro = "0.22"
bytes = "1.11.1"
rdkafka = "0.39"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = "0.11"
# Only for rdkafka's admin client, which is async. The driver itself is
# synchronous — it starts containers and polls a row count — so this is a
# current-thread runtime built for one call, not an architecture.
tokio = { version = "1.52", default-features = false, features = ["rt", "time"] }
toml = "1.1"
uuid = { version = "1.18.1", default-features = false, features = ["v7", "std"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
