# The gates this repository claims to have.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No third-party toolchain action. `rust-toolchain.toml` pins the channel
      # and its components, rustup is preinstalled on the runner, and `rustup
      # show` is what materialises the pin — so the compiler CI uses is the same
      # one the file names, with nothing else trusted to get that right. The pin
      # is provenance here rather than hygiene: codegen moves throughput.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
          cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # `--locked` throughout. A benchmark that cannot say which dependency graph
      # produced a number is not evidence, and a CI run that quietly updates the
      # lockfile is a CI run testing something other than what was committed.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      # The same command README.md tells a contributor to run locally, running
      # the same library code — not a second implementation of the checks that
      # could drift from the one a human invokes.
      - name: bench validate
        run: cargo run --quiet --locked -p spate-benchmark-harness --bin bench -- validate

      # A sweep is not runnable here, but the plan it would execute is, and a
      # selector grammar that silently expands to the whole matrix is the kind of
      # defect that costs hours on the machine that can run it.
      - name: bench run --dry-run (c8gd-metal-24xl-ec2-docker)
        run: cargo run --quiet --locked -p spate-benchmark-harness --bin bench -- run '*' --dry-run --env c8gd-metal-24xl-ec2-docker

  # The AWS footprint is not here: the launcher, collector and Terraform live in
  # the private ops repo (it deploys to a shared account), and that repo runs its
  # own terraform fmt/validate/tflint/trivy gates. This repo keeps only what is
  # public and reproducible — the harness and the box payload.
