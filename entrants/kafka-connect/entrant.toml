schema = 1

[entrant]
id       = "kafka-connect"
name     = "Kafka Connect + clickhouse-kafka-connect"
homepage = "https://github.com/ClickHouse/clickhouse-kafka-connect"
repo     = "https://github.com/ClickHouse/clickhouse-kafka-connect"
docs     = "https://clickhouse.com/docs/integrations/kafka/clickhouse-kafka-connect-sink"
# Every artefact in the container is Apache-2.0: the `apache/kafka` image is the
# ASF's own, the connector is Apache-2.0, and the Avro converter's artifacts are
# Apache-2.0 at the POM level (verified against
# packages.confluent.io/maven/io/confluent/kafka-connect-avro-converter/8.3.0).
# The former [planned].licence_gate concerned the Confluent Community Licence,
# which covers the Schema Registry *server* and the Confluent Platform *images*
# — neither is present in this arm. The converter's non-Central origin is still
# declared under [[deviations]] rather than smoothed over.
licence  = "Apache-2.0"
vendor   = "clickhouse"
kind     = "connector-runtime"
language = ["java"]
runtime  = "jvm"
status   = "active"

[maintainer]
who = "spate-benchmark"
reviewed_upstream = false

[display]
order = 40
hue   = 275
short = "Connect"

[version]
# Read from the jar filenames that actually run: the Connect runtime jar in the
# distribution's classpath and the connector jar in the plugin path. The
# `apache/kafka` image's OCI labels carry no usable version, and a version a
# human typed in is not provenance. The Dockerfile's drift guard (`RUN test -n`)
# fails the build if either jar stops matching these patterns, so this command
# cannot silently start printing an empty half.
#
# Joined with `-`, not `+`: the driver's version parser accepts only
# `[0-9A-Za-z.-]` tokens, so a `+` would resolve no version at all and refuse
# every run.
strategy = "command"
command  = ["sh", "-c", "printf '%s-%s\\n' \"$(ls /opt/kafka/libs | sed -n 's/^connect-runtime-\\(.*\\)\\.jar$/\\1/p')\" \"$(ls /opt/kafka/plugins/clickhouse-kafka-connect | sed -n 's/^clickhouse-kafka-connect-\\(v[0-9.]*\\)-confluent\\.jar$/\\1/p')\""]
pinned   = "4.3.1-v1.4.0"

[build]
context    = "../.."
dockerfile = "Dockerfile"
image      = "spate-bench-kafka-connect"

# One container, running Connect STANDALONE: worker, connector and tasks in one
# JVM. Standalone has no control plane by design, so there is nothing to
# allocate on top. Distributed-with-one-worker was rejected: it adds three
# internal topics (config, offset, status) of broker work that no other arm
# causes, needs a REST bootstrap step to install the connector, and buys nothing
# — a sink's consumer offsets go to `__consumer_offsets` in BOTH modes. The
# offset storage file standalone requires is a StandaloneConfig formality,
# otherwise unused for sinks.
[envelope]
cpus   = "32"
memory = "96g"

[[envelope.container]]
role   = "data-plane"
name   = "worker"
cpus   = "32"
memory = "96g"
# Where the Dockerfile's KAFKA_OPTS aims -Xlog:gc*. The harness copies this out
# after a run; `entrants_are_valid` checks the path against the Dockerfile.
gc_log = "/opt/kafka/logs/gc.log"

[guarantees]
delivery    = "at-least-once"
durability  = "offset-commit"
# offset.flush.interval.ms in worker.properties.tmpl — matched to the 5 s
# durability cadence every arm runs (Spate's commit interval, Flink's
# checkpoint interval). The shipped default is 60000.
interval_ms = 5000

# Arm-specific ClickHouse objects: Connect has no fan-out operator, so the
# connector lands the nested batch into a Null-engine landing table and a
# materialized view does the flatten/filter/derive into the shared
# `sensor_events`. Applied per repetition by the harness DDL hook; see
# clickhouse/arm.sql for the SQL and the reasoning, and [[deviations]] for the
# measurement consequence.
[clickhouse]
arm_sql          = "clickhouse/arm.sql"
arm_teardown_sql = "clickhouse/arm_teardown.sql"
# The landing table's parent inserts carry the MV's cost in system.query_log,
# so they are attributed to this arm. Bare name — the harness qualifies it.
attribution_tables = ["sensor_batches_landing"]

# GROUP_ID is used as the CONNECTOR NAME, not as a consumer group.id: Connect
# derives a sink's consumer group as `connect-<name>`, so the fresh consumer
# group each repetition needs comes from naming the connector with the driver's
# fresh id. (`consumer.override.group.id` would also work — standalone applies
# connector-level overrides under the default policy — but the name keeps the
# connector and its group one identity, with nothing to keep in step.)
#
# CLICKHOUSE_PASSWORD comes from the driver ({{clickhouse_password}} is the
# value infra actually started the server with), so this arm cannot drift if
# that value ever changes; the image keeps a matching ENV default so the
# README's by-hand recipe works without the driver.
[env]
BOOTSTRAP           = "{{broker_internal}}"
REGISTRY_URL        = "{{registry_internal}}"
CLICKHOUSE_URL      = "{{clickhouse_internal}}"
CLICKHOUSE_PASSWORD = "{{clickhouse_password}}"
TOPIC               = "{{topic}}"
GROUP_ID            = "{{group_id}}"
OFFSET_RESET        = "{{offset_reset}}"
TASKS_MAX           = "{{knob:tasks}}"
BUFFER_COUNT        = "{{knob:buffer_count}}"
BUFFER_FLUSH_MS     = "{{knob:buffer_flush_ms}}"

# bufferFlushTime must be > 0 whenever bufferCount > 0: the connector's
# at-least-once buffer flushes on size OR time, and a zero flush time strands
# any sub-buffer_count tail forever — the drain never completes. The
# [[constraints]] floor below enforces the operative half (every committed
# variant and every sweep cell pins buffer_count > 0, so flush time may never
# be zero); only the conditional only-when-buffering form is inexpressible.
[[constraints]]
knob     = "buffer_flush_ms"
at_least = 1
why      = """
bufferFlushTime=0 disables the connector's time-based flush, so any tail
smaller than bufferCount is never inserted and a drain runs to its deadline
instead of completing — minutes per cell, reported as a timeout for an arm
that is working.
"""

[[variants]]
id       = "rowbinary-mv"
label    = "Kafka Connect · clickhouse-kafka-connect · RowBinary + MV"
approach = "realistic"
default  = true
knobs    = { tasks = 32, buffer_count = 2000, buffer_flush_ms = 1000 }
# Verified in the v1.4.0 source: inserts go as RowBinary
# (ClickHouseWriter.java:1066; RowBinaryWithDefaults only when the target has
# DEFAULT columns, and the landing table has none).
reports  = { wire_format = "rowbinary" }

[[deviations]]
what = """
Kafka Connect has no fan-out operator — one Kafka record cannot become ~100 rows
inside the runtime — so the connector lands the nested batch (Null-engine
landing table, per-entrant DDL) and a ClickHouse materialized view performs the
flatten, both filters and both derived columns; the transform's CPU therefore
runs inside the shared ClickHouse where the cgroup sampler cannot see it.
"""
why = """
This arm's efficiency comparison leans on ClickHouse's own ProfileEvents
(system.query_log), whose MV cost rides on the parent insert and excludes
background merges; the arm's client-side CPU and the other arms' are not the
same work, and the page must say so. For the same reason the harness refuses
to gate this arm's headroom against the direct-insert ingest ceiling — the
ceiling was measured without the MV's per-row work — so its records carry
headroom-unproven on the ClickHouse axis rather than a share against a figure
that does not describe them.
"""
affects = ["cpu", "server-side-cpu"]

[[deviations]]
what = """
An unbundled Avro converter — Apache Kafka's Connect runtime ships none, so this
arm adds io.confluent:kafka-connect-avro-converter 8.3.0 and its dependency
closure, distributed from Confluent's Maven repository rather than Maven
Central.
"""
why = """
Apache-2.0 at the artifact level (POM-verified). Apicurio's Apache-2.0
converter was evaluated and rejected: its documented Confluent compatibility
is server-side (adr/0001 scopes it to Apicurio *serving* the Confluent API),
and its own serdes are documented only against Apicurio's registry API — no
supported client-side path to Redpanda's Confluent-API registry, and no other
Apache-2.0 converter on Maven Central speaks that API at all.
"""
affects = ["decode-path", "licensing"]

[[deviations]]
what = """
clickhouse-kafka-connect derives insert_deduplication_token =
topic-partition-minOffset-maxOffset on every schema-path insert, even with
exactlyOnce=false.
"""
why = """
Inert here — the landing table is ENGINE = Null (no parts, no dedup window) —
but it is the same mechanism ddl.sql discloses for the Spate arm, so it is
declared rather than discovered.
"""
affects = ["dedup"]
