# Logging for the comparison arm. Replaces /opt/flink/conf/log4j-console.properties.
#
# Why this file exists at all: the ClickHouse connector logs several INFO lines per
# submitted batch (`Submitting N request entries`, `Data sent: bytes…`,
# `Successfully completed…`). A full drain contains tens of thousands of INSERTs.
# Console writes also occur on the sink's completion path, and methodology/ rule 2 says no debug logging
# on the hot path. Turning it down is configuration, not a code change.
#
# Root stays at INFO so start-up, checkpointing and failure diagnostics survive.
# Set CH_LOG_LEVEL=INFO to put the per-batch lines back while debugging.

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# Per-batch submit/complete logging on the sink's hot path.
logger.chsink.name = org.apache.flink.connector.clickhouse
logger.chsink.level = ${env:CH_LOG_LEVEL:-WARN}

# clickhouse-java client-v2 chatter (connection pool, settings echo).
logger.chclient.name = com.clickhouse
logger.chclient.level = ${env:CH_LOG_LEVEL:-WARN}

# The Kafka consumer logs its full resolved config per subtask at INFO; this
# startup output grows with the configured job parallelism.
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN

# Avro's reflection/compatibility warnings are not relevant to a fixed schema.
logger.avro.name = org.apache.avro
logger.avro.level = WARN

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# Suppress the irrelevant warning about upper-bound checks on the REST handler.
logger.netty.name = org.apache.flink.shaded.akka.org.jboss.netty.channel.DefaultChannelPipeline
logger.netty.level = ERROR
