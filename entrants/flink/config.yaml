# Flink 2.x reads THIS FILE ONLY. `flink-conf.yaml` was removed in 2.0 and a file
# by that name is silently ignored — the worst failure mode for a benchmark,
# because the job runs and the numbers are simply wrong.
#
# This file REPLACES the image's, so it must also carry forward what the image
# needs. The dangerous entry is `env.java.opts.all`: Flink 2.x on Java 17 needs
# those `--add-opens`/`--add-exports` and loses them silently if you write a
# fresh file. The Dockerfile diffs our copy against the base image's and fails
# the build on drift.
#
# Three values here are ALSO set by the driver at run time, through the official
# image's own environment contract, and the record's knob is what is
# authoritative: `parallelism.default`, `taskmanager.numberOfTaskSlots` and the
# sink batch settings. The committed defaults are kept equal to the published
# knobs so a reviewer starting the container by hand gets the configuration the
# numbers describe.

# ---------------------------------------------------------------------------
# Cluster topology
# ---------------------------------------------------------------------------

jobmanager:
  bind-host: 0.0.0.0
  rpc:
    address: localhost          # overwritten by the entrypoint
    port: 6123
  execution:
    failover-strategy: region
  memory:
    process:
      # 2 GiB container, 128 MiB slack.
      size: 1920m

taskmanager:
  bind-host: 0.0.0.0
  # One slot per subtask in a single TaskManager. Moves with parallelism.default
  # and never independently.
  numberOfTaskSlots: 32
  memory:
    process:
      # Total process memory in the 96 GiB data-plane container, from which Flink
      # derives heap, direct and metaspace. `entrants_are_valid` refuses anything
      # below 86016m (limit/8 slack), so this is a floor the harness imposes as
      # much as a choice.
      size: 86016m
    managed:
      # Default 0.4 RESERVES managed memory whether or not anything uses it, and
      # a stateless job on the `hashmap` backend uses none — 5.7 GiB allocated
      # and never touched. The single most important line in this file.
      fraction: 0.0
    task:
      off-heap:
        # Headroom for the sink's socket I/O, so a burst surfaces as backpressure
        # rather than as `OutOfMemoryError: Direct buffer memory`.
        size: 512m
  network:
    memory:
      buffer-debloat:
        # Debloating trades throughput for checkpoint latency. Measured on
        # throughput.
        enabled: false

parallelism:
  # One subtask per PARTITION (32), matched to the 32-CPU data plane. The
  # drain is paced by the busiest source subtask: any subtask owning two
  # partitions paces the drain at half rate, and a 33rd subtask would never
  # receive a split.
  default: 32

rest:
  address: 0.0.0.0
  bind-address: 0.0.0.0

blob:
  server:
    port: '6124'                # overwritten by the entrypoint

query:
  server:
    port: '6125'                # overwritten by the entrypoint

# ---------------------------------------------------------------------------
# Execution
# ---------------------------------------------------------------------------

execution:
  buffer-timeout:
    # Flush a network buffer only when it is full. In 2.x the old duration key
    # split into `.enabled` and `.interval`, so setting the old one is
    # accepted-but-deprecated rather than doing what you meant.
    enabled: false
  checkpointing:
    # Matched to every other arm's durability cadence. Checkpointing is OFF
    # entirely unless an interval is set, so omitting this would silently remove
    # Flink's fault tolerance and flatter its number.
    interval: 5s
    # The default is EXACTLY_ONCE, which means aligned barriers and the buffer
    # blocking that comes with them — for a guarantee no other arm provides.
    mode: AT_LEAST_ONCE
    # The sink checkpoints its buffered entries, so state is proportional to
    # `buffered_rows x parallelism`. The default `jobmanager` storage caps state
    # at 5 MiB and would begin failing checkpoints under load.
    storage: filesystem
    dir: file:///opt/flink/checkpoints

pipeline:
  # Chained operators hand the same reference downstream instead of copying.
  # FlattenEvents is written for it.
  object-reuse: true
  operator-chaining:
    # Load-bearing: source, flatMap and sink writer are one chain, so no
    # GenericRecord and no output row is ever serialized.
    enabled: true

state:
  backend:
    # The only state is Kafka offsets plus the sink's buffered entries, which is
    # also why managed memory can be zero.
    type: hashmap

# ---------------------------------------------------------------------------
# JVM
# ---------------------------------------------------------------------------

env:
  java:
    opts:
      # VERBATIM from the base image. The Dockerfile fails the build on drift.
      all: --add-exports=java.rmi/sun.rmi.registry=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED
      taskmanager: -Xlog:gc*:file=/opt/flink/log/gc.log:uptime,level,tags:filecount=0
      jobmanager: -Xlog:gc*:file=/opt/flink/log/gc-jm.log:uptime,level,tags:filecount=0
