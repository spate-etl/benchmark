schema = 1

[entrant]
id       = "flink"
name     = "Apache Flink"
homepage = "https://flink.apache.org"
repo     = "https://github.com/apache/flink"
docs     = "https://nightlies.apache.org/flink/flink-docs-release-2.2/"
licence  = "Apache-2.0"
vendor   = "apache"
kind     = "stream-processor"
language = ["java"]
runtime  = "jvm"
status   = "active"

[maintainer]
# `spate-benchmark` means we wrote this arm. A third-party contributor puts their
# own handle here, and the site shows who to contact when an arm breaks.
who = "spate-benchmark"
# Rule 7. Not yet sent upstream; the site shows this honestly rather than
# implying a review that has not happened.
reviewed_upstream = false
review_url        = ""

[display]
order = 20
hue   = 32
short = "Flink"

[version]
# Read from the shipped distribution jar, which is the artefact that actually
# runs. The image label is not usable: `flink:2.2.1-java17` carries no Flink
# version label, only `org.opencontainers.image.version: 24.04` for the base
# operating system. `pinned` is asserted against what is resolved, so a
# base-image bump refuses the run rather than publishing a mislabelled number.
strategy = "command"
command  = ["sh", "-c", "ls /opt/flink/lib | sed -n 's/^flink-dist-\\(.*\\)\\.jar$/\\1/p'; printf 'toolchain: '; java -version 2>&1 | head -1"]
pinned   = "2.2.1"

[build]
context    = "../.."
dockerfile = "Dockerfile"
image      = "spate-bench-flink"

# Flink splits across two containers. The data plane gets the full 32 CPU / 96 GiB
# envelope — the same budget every other arm gets — and the JobManager is
# allocated on top as control plane. Its measured consumption (0.07–0.21 cores)
# is published beside the arm's total rather than pre-charged against it.
[envelope]
cpus   = "32"
memory = "96g"

[[envelope.container]]
role   = "control-plane"
name   = "jm"
cpus   = "1"
memory = "2g"
args   = ["standalone-job"]
# Where config.yaml's env.java.opts.jobmanager sends -Xlog:gc*. The harness
# reads GC figures from the path declared here; a container that declared none
# would simply record no gc_* metrics.
gc_log = "/opt/flink/log/gc-jm.log"

[[envelope.container]]
role   = "data-plane"
name   = "tm"
cpus   = "32"
memory = "96g"
args   = ["taskmanager"]
# Where entrypoint.sh's FLINK_ENV_JAVA_OPTS_TM sends -Xlog:gc*.
gc_log = "/opt/flink/log/gc.log"

# The disclosure the control-plane container above requires: a container
# budgeted on top of the envelope must be declared as a deviation with
# "envelope" in `affects`, and validation refuses the descriptor without it.
[[deviations]]
what    = "Runs as two containers: the 32 CPU / 96 GiB data plane, plus a JobManager control-plane container (1 CPU / 2 GiB) allocated on top of the envelope."
why     = "Flink cannot run a standalone job without a JobManager. Its measured consumption (0.07–0.21 cores) is published beside the arm's totals rather than silently pre-charged against the data plane's budget."
affects = ["envelope"]

[guarantees]
delivery    = "at-least-once"
durability  = "checkpoint"
interval_ms = 5000

[volumes]
# Named volumes only, never host bind mounts: Docker Desktop shares bind-mounted
# files over VirtioFS, which is materially slower, and this path is the
# checkpoint directory — one of the things under measurement.
named = ["spate-bench-flink-cp:/opt/flink/checkpoints"]

# Flink's own vocabulary. Sending another arm's variable names would leave Flink
# on its defaults while the record claimed knob values that were never applied.
[env]
TOPIC                   = "{{topic}}"
GROUP_ID                = "{{group_id}}"
STARTING_OFFSETS        = "{{offset_reset}}"
BOOTSTRAP               = "{{broker_internal}}"
REGISTRY_URL            = "{{registry_internal}}"
CLICKHOUSE_URL          = "{{clickhouse_internal}}"
JOB_MANAGER_RPC_ADDRESS = "{{container:jm}}"
SINK_LINGER_MS          = "{{knob:linger_ms}}"
SINK_MAX_BATCH_ROWS     = "{{knob:max_rows}}"
SINK_MAX_BUFFERED_ROWS  = "{{knob:buffered_rows}}"
SINK_MAX_IN_FLIGHT      = "{{knob:inflight}}"

# Public Flink configuration, applied by the official image entrypoint.
# Slots are per TaskManager; parallelism is the job width across all TaskManagers.
# The current contract sizes consumer width to the 32-partition topic. Reduced
# widths are exploratory pending methodology issue #78, not default candidates.
FLINK_PROPERTIES = """
parallelism.default: {{knob:parallelism}}
taskmanager.memory.process.size: {{knob:process_mib}}m
taskmanager.memory.network.max: {{knob:network_memory_max}}
"""
# The image's FLINK_PROPERTIES parser strips whitespace. Flink's own launcher
# accepts this environment override directly, preserving JVM argument separators.
BENCH_JVM_OPTS = "{{knob:jvm_opts}}"
BENCH_PROCESS_MIB = "{{knob:process_mib}}"
EXPECT_RUNTIME_IMAGE = "{{knob:runtime_image}}"
TASK_MANAGER_NUMBER_OF_TASK_SLOTS = "{{knob:slots}}"
SINK_MAX_BATCH_BYTES = "{{knob:max_batch_bytes}}"
KAFKA_MAX_POLL_RECORDS = "{{knob:poll_records}}"
KAFKA_MAX_PARTITION_FETCH_BYTES = "{{knob:partition_fetch_bytes}}"
KAFKA_FETCH_MAX_BYTES = "{{knob:fetch_bytes}}"
CLICKHOUSE_MAX_CONNECTIONS = "{{knob:connections}}"
CLICKHOUSE_NETWORK_BUFFER_BYTES = "{{knob:network_buffer_bytes}}"
AVRO_MODE = "{{knob:avro_mode}}"

# The assertion, not the setting. `ComparisonJob` compares this against the
# parallelism the cluster actually resolved and refuses the job if they differ,
# so a cell that silently ran at the wrong width fails loudly instead of
# producing a plausible number.
EXPECT_PARALLELISM = "{{knob:parallelism}}"

# `AsyncSinkWriter` requires its buffered-request bound to be strictly greater
# than its batch size, so `buffered_rows = max_rows` is not a slow configuration
# but a job that will not start. Declared here so the driver refuses it before
# any container starts; `ComparisonJob` keeps its own copy of the check, because
# the image can also be run by hand.
[[constraints]]
knob    = "buffered_rows"
exceeds = "max_rows"
why     = """
Flink's AsyncSinkWriter requires maxBufferedRequests > maxBatchSize and refuses
to construct otherwise, so the job fails at submission rather than running
slowly. Raise buffered_rows with max_rows: it is also the bound on checkpoint
state, since the sink checkpoints its buffered entries, and on retained payload
memory across every subtask.
"""

# The connector's typed mode forces RowBinaryWithNamesAndTypes — the Java
# client has no Native writer (clickhouse-java#2509) — so this is the one wire
# format the arm can write, and the id says which.
[[variants]]
id       = "rowbinary-nt"
label    = "Flink 2.2.1 · RowBinary"
approach = "realistic"
default  = true
knobs    = { parallelism = 32, slots = 32, process_mib = 21504, network_memory_max = "9223372036854775807b", runtime_image = "flink:2.2.1-java17", jvm_opts = "", avro_mode = "specific", linger_ms = 1000, max_rows = 12500, buffered_rows = 25000, inflight = 1, max_batch_bytes = 16777216, poll_records = 500, partition_fetch_bytes = 1048576, fetch_bytes = 52428800, connections = 10, network_buffer_bytes = 300000 }
reports  = { wire_format = "rowbinary_nt" }
