[package]
name = "spate-arm"
description = "The Spate arm of the streaming ETL benchmark."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# This crate is a plain consumer of the framework's public API — the same shapes
# a user writes — plus the row type and flatten for this workload.
#
# That row type lives HERE rather than in the harness on purpose. The harness
# computes expectations and encodes Avro; it never serialises a row. Keeping
# `Row` in the arm is what removes the harness's last dependency on the
# framework, and it makes this arm structurally symmetric with the Flink arm,
# which owns its own `SensorRow.java`.
[dependencies]
spate-benchmark-harness = { workspace = true }

serde = { workspace = true }
serde_yaml = { workspace = true }
bytes = { workspace = true }

# The framework under test. Only the four crates this pipeline actually uses —
# not the facade — so the arm's dependency graph is the one a user integrating
# these connectors would get.
spate-avro = { workspace = true }
spate-clickhouse = { workspace = true }
spate-core = { workspace = true }
spate-kafka = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true

[lib]
name = "spate_arm"
path = "src/lib.rs"

# `test = false` on the bin, deliberately, with the tests living in the lib. A
# `#[cfg(test)]` module inside a `test = false` binary is never compiled or run,
# so tests placed there are silently dead — and the flatten this arm performs is
# logic the published numbers depend on.
[[bin]]
name = "spate-arm"
path = "src/main.rs"
test = false
