schema = 1

[entrant]
id       = "spate"
name     = "Spate"
homepage = "https://github.com/spate-etl/spate"
repo     = "https://github.com/spate-etl/spate"
licence  = "Apache-2.0"
# `self` marks this as the vendor's own entry. The site renders a disclosure on
# every row of an entrant with this value, and nothing in the site branches on
# the literal id "spate" — a CI lint enforces that, so the neutrality claim is
# checkable rather than asserted.
vendor   = "self"
kind     = "etl-framework"
language = ["rust"]
runtime  = "native"
status   = "active"

[maintainer]
who = "spate-benchmark"
# Trivially true: we are upstream. The site renders "n/a" rather than a tick, so
# this does not read as external validation we have not earned.
reviewed_upstream = true

[display]
order = 10
# A hue ANGLE, not a hex colour. The site owns contrast in light and dark themes,
# and an entrant supplying #ff0000 would fail one of them — while a site that
# overrode the value would make the field a lie.
hue   = 210
short = "Spate"

[version]
# Resolved by running the built image, so the recorded version is the one that
# was linked rather than one a human typed.
strategy = "command"
command  = ["/usr/local/bin/spate-arm", "--version"]

[build]
# The repository root: the arm is a cargo workspace member and needs the
# workspace manifest and lockfile.
context    = "../.."
dockerfile = "Dockerfile"
image      = "spate-bench-spate"

# 96 GiB, the same as every other arm, and far more than this arm will use. The
# point is that no system is memory-bound: a GC-managed runtime that has to
# collect more often than it otherwise would is being measured on our allocation
# choice rather than on its own design.
[envelope]
cpus   = "32"
memory = "96g"

[[envelope.container]]
role   = "data-plane"
name   = "sut"
cpus   = "32"
memory = "96g"

[guarantees]
delivery    = "at-least-once"
durability  = "offset-commit"
# Matched to Flink's 5s AT_LEAST_ONCE checkpoint interval, so both arms pay for
# the same guarantee at the same cadence. Fixed by METHODOLOGY, not a knob.
interval_ms = 5000

# The disclosure workload/clickhouse/ddl.sql promises on this entrant. The
# asymmetry is applied by the framework under test rather than by anything in
# this directory, so a reviewer grepping these sources would never find it —
# this entry is where a reader is told anyway.
[[deviations]]
what    = "The framework's writer sets insert_deduplication_token on every sealed batch, so ClickHouse skips content-hash deduplication for this arm's inserts; every other arm's inserts are deduplicated by block content hash."
why     = "The token is part of the framework's shipped at-least-once delivery path (rule 1: the system's own API, as any user would run it), but it changes what the arm asks of the shared target and favours the vendor's arm, so it is declared rather than left in a SQL comment. See workload/clickhouse/ddl.sql."
affects = ["server-side"]

[env]
BOOTSTRAP      = "{{broker_internal}}"
REGISTRY_URL   = "{{registry_internal}}"
CLICKHOUSE_URL = "{{clickhouse_internal}}"
TOPIC          = "{{topic}}"
GROUP_ID       = "{{group_id}}"
OFFSET_RESET   = "{{offset_reset}}"
THREADS        = "{{knob:threads}}"
SHARDS         = "{{knob:shards}}"
INFLIGHT       = "{{knob:inflight}}"
LINGER_MS      = "{{knob:linger_ms}}"
MAX_ROWS       = "{{knob:max_rows}}"

# One axis: the wire format. Both are published because they are not the same
# amount of server-side work, and the difference belongs to the reader.
#
# Not declared here and not reachable by the driver: `IO_THREADS` (pinned at 2)
# and `BUDGET_MIB` (always derived). Both are read by `main.rs` and appear in no
# descriptor, so no record reports them.

[[variants]]
id       = "native"
label    = "Spate · Native"
approach = "realistic"
default  = true
env      = { FORMAT = "native" }
knobs    = { threads = 32, shards = 32, inflight = 4, linger_ms = 500, max_rows = 262144 }
reports  = { wire_format = "native" }

# The wire-format control, and the arm to read against Flink: it separates "the
# framework is faster" from "we chose a faster wire format". ClickHouse's
# official Flink connector can only write RowBinaryWithNamesAndTypes because the
# Java client has no Native writer (clickhouse-java#2509).
[[variants]]
id       = "rowbinary"
label    = "Spate · RowBinary"
approach = "realistic"
env      = { FORMAT = "rowbinary" }
knobs    = { threads = 32, shards = 32, inflight = 4, linger_ms = 500, max_rows = 262144 }
reports  = { wire_format = "rowbinary" }
