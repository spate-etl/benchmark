schema = 1

[entrant]
id       = "spate"
name     = "Spate"
homepage = "https://github.com/spate-etl/spate"
repo     = "https://github.com/spate-etl/spate"
licence  = "Apache-2.0"
# `self` marks this as the vendor's own entry. The site renders a disclosure on
# every row of an entrant with this value, and nothing in the site branches on
# the literal id "spate" — a CI lint enforces that, so the neutrality claim is
# checkable rather than asserted.
vendor   = "self"
kind     = "etl-framework"
language = ["rust"]
runtime  = "native"
status   = "active"

[maintainer]
who = "spate-benchmark"
# Trivially true: we are upstream. The site renders "n/a" rather than a tick, so
# this does not read as external validation we have not earned.
reviewed_upstream = true

[display]
order = 10
# A hue ANGLE, not a hex colour. The site owns contrast in light and dark themes,
# and an entrant supplying #ff0000 would fail one of them — while a site that
# overrode the value would make the field a lie.
hue   = 210
short = "Spate"

[version]
# Resolved by running the built image, so the recorded version is the one that
# was linked rather than one a human typed.
strategy = "command"
command  = ["/usr/local/bin/spate-arm", "--version"]

[build]
# The repository root: the arm is a cargo workspace member and needs the
# workspace manifest and lockfile.
context    = "../.."
dockerfile = "Dockerfile"
image      = "spate-bench-spate"

# 96 GiB, the same as every other arm, and far more than this arm will use. The
# point is that no system is memory-bound: a GC-managed runtime that has to
# collect more often than it otherwise would is being measured on our allocation
# choice rather than on its own design.
[envelope]
cpus   = "32"
memory = "96g"

[[envelope.container]]
role   = "data-plane"
name   = "sut"
cpus   = "32"
memory = "96g"

[guarantees]
delivery    = "at-least-once"
durability  = "offset-commit"
# Matched to Flink's 5s AT_LEAST_ONCE checkpoint interval, so both arms pay for
# the same guarantee at the same cadence. Fixed by METHODOLOGY, not a knob.
interval_ms = 5000

# The disclosure workload/clickhouse/ddl.sql promises on this entrant. The
# asymmetry is applied by the framework under test rather than by anything in
# this directory, so a reviewer grepping these sources would never find it —
# this entry is where a reader is told anyway.
[[deviations]]
what    = "The framework's writer sets insert_deduplication_token on every sealed batch, so ClickHouse skips content-hash deduplication for this arm's inserts; every other arm's inserts are deduplicated by block content hash."
why     = "The token is part of the framework's shipped at-least-once delivery path (rule 1: the system's own API, as any user would run it), but it changes what the arm asks of the shared target and favours the vendor's arm, so it is declared rather than left in a SQL comment. See workload/clickhouse/ddl.sql."
affects = ["server-side"]

# Rule 2 asks for a measurably suboptimal default to be stated as avoidable
# where the site shows it. The site renders this table and not the README.
[[deviations]]
what    = "io_threads is held at the framework default of 2. On this rig and this framework version, 8 I/O workers raised native from 21.1M to 33.1M rows/s and native-zstd from 8.0M to 31.0M rows/s (spate#1133). The published rate is avoidable."
why     = "spate#1137 lets a sink compress each chunk on the pipeline threads, and the ClickHouse sink in this framework version compresses on the I/O runtime. Both values are re-measured on the first release whose ClickHouse sink compresses on the pipeline threads, and the faster one is declared."
affects = ["throughput"]

[env]
BOOTSTRAP      = "{{broker_internal}}"
REGISTRY_URL   = "{{registry_internal}}"
CLICKHOUSE_URL = "{{clickhouse_internal}}"
TOPIC          = "{{topic}}"
GROUP_ID       = "{{group_id}}"
OFFSET_RESET   = "{{offset_reset}}"
THREADS        = "{{knob:threads}}"
SHARDS         = "{{knob:shards}}"
INFLIGHT       = "{{knob:inflight}}"
LINGER_MS      = "{{knob:linger_ms}}"
MAX_ROWS       = "{{knob:max_rows}}"
COMPRESSION    = "{{knob:compression}}"
IO_THREADS     = "{{knob:io_threads}}"

# Two axes. The wire format: both are published because they are not the same
# amount of server-side work, and the difference belongs to the reader. The
# insert body's compression: `lz4` is the framework default, and the `zstd`
# variants measure what the sink spends compressing and what ClickHouse spends
# decompressing. On this single-host rig the sink reaches ClickHouse over a
# local bridge, so a smaller body saves no transfer time here.
#
# Not declared here and not reachable by the driver: `BUDGET_MIB` (always
# derived). `main.rs` reads it and no descriptor sets it, so no record reports it.

[[variants]]
id       = "native"
label    = "Spate · Native"
approach = "realistic"
default  = true
env      = { FORMAT = "native" }
# `linger_ms` exceeds the time a shard takes to fill `max_rows`, so a batch
# seals on rows. Below that the linger seals it first and caps the batch
# regardless of `max_rows`.
knobs    = { threads = 32, shards = 32, inflight = 4, linger_ms = 2000, max_rows = 1048576, compression = "lz4", io_threads = 2 }
reports  = { wire_format = "native" }

# The arm to read against Flink, which writes the same wire format: ClickHouse's
# official Flink connector can only write RowBinaryWithNamesAndTypes because the
# Java client has no Native writer (clickhouse-java#2509). The framework's
# `rowbinary` setting sends RowBinaryWithNamesAndTypes, with the column names and
# types the sink fetched from the server as the header.
#
# Its batching differs from the Native variant's, so the pair separates "the
# framework is faster" from "we chose a faster wire format" only once both
# carry the same batch settings.
[[variants]]
id       = "rowbinary"
label    = "Spate · RowBinary"
approach = "realistic"
env      = { FORMAT = "rowbinary" }
knobs    = { threads = 32, shards = 32, inflight = 4, linger_ms = 500, max_rows = 262144, compression = "lz4", io_threads = 2 }
reports  = { wire_format = "rowbinary_nt" }

# The Native variant with the insert body compressed by zstd at level 3, the
# level `compression: zstd` selects. Everything else matches `native`, so the
# pair isolates the codec.
[[variants]]
id       = "native-zstd"
label    = "Spate · Native · zstd"
approach = "realistic"
env      = { FORMAT = "native" }
knobs    = { threads = 32, shards = 32, inflight = 4, linger_ms = 2000, max_rows = 1048576, compression = "zstd:3", io_threads = 2 }
reports  = { wire_format = "native" }

# zstd at level 1, the cheapest level the sink accepts.
[[variants]]
id       = "native-zstd1"
label    = "Spate · Native · zstd:1"
approach = "realistic"
env      = { FORMAT = "native" }
knobs    = { threads = 32, shards = 32, inflight = 4, linger_ms = 2000, max_rows = 1048576, compression = "zstd:1", io_threads = 2 }
reports  = { wire_format = "native" }
