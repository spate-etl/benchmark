[package]
name = "spate-benchmark-harness"
description = "Driver and CLI for the Spate streaming ETL benchmark."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The measurement harness depends on NO system under test, and that is a
# property CI asserts rather than a coincidence. It is what lets a competitor
# audit how they were measured without having to trust our crates, and it makes
# the Spate arm structurally symmetric with the Flink arm, which likewise owns
# its own row types.
[dependencies]
apache-avro = { workspace = true }
# The ceiling rig's ArrowStream encoder (`ceiling::Format::ArrowStream`) and its
# round-trip test, and nothing else. The three sub-crates are named instead of
# the `arrow` facade because the facade pulls the CSV, JSON and compute kernels
# this crate has no use for; and they are kept out of `[workspace.dependencies]`
# so no entrant can inherit them by workspace reference. That is the whole
# claim: the spate arm depends on this crate, so all three — plus the
# semver-ranged transitive arrow-buffer/-data/-select — do enter its build graph
# (`cargo tree -i arrow-array` shows it), where the ceiling encoders are dead
# code the arm never calls. Pinned exactly, and to one version across the three,
# because arrow-rs releases them in lockstep and the bytes this encoder emits
# are the denominator of a committed ceiling — a silent minor-bump that moved
# the IPC layout would change what a "reproduced" pass sends; `--locked` is what
# holds the transitive arrow crates to the lockfile's versions.
arrow-array = "=59.1.0"
arrow-ipc = "=59.1.0"
arrow-schema = "=59.2.0"
bytes = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true, features = ["parse"] }
uuid = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }
toml = { workspace = true, features = ["parse"] }

[lints]
workspace = true

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
test = false
